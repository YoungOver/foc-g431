name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make docs/run.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trace
          path: docs/run.csv

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/foc.elf
            build/foc.bin
            build/foc.map
